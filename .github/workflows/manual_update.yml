name: Manual Schedule Update

on:
  workflow_dispatch:
    inputs:
      pdf_filename:
        description: 'Enter the exact name of the PDF file (e.g., schedule.pdf)'
        required: true
        default: 'schedule.pdf'

permissions:
  contents: write

jobs:
  convert_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pdfplumber

      - name: Run Converter
        run: |
          # Runs your python script with the filename you typed
          python convert.py "${{ github.event.inputs.pdf_filename }}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # --- IMPORTANT ---
          # We force add the teacher data JSON so the contact button works!
          git add schedule_data.json teachers_data.json
          
          # Commit and push
          git commit -m "Update schedule and teacher contacts via manual trigger" || echo "No changes to commit"
          git push
