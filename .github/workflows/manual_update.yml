name: Manual Schedule Update

on:
  workflow_dispatch:
    inputs:
      pdf_filename:
        description: 'Enter the exact name of the PDF file (e.g., schedule.pdf)'
        required: true
        default: 'schedule.pdf'

permissions:
  contents: write

jobs:
  convert_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pdfplumber

      - name: Run Converter
        run: |
          # We pass the filename from the input to your python script
          # Note: Ensure your convert.py is set up to accept arguments
          python convert.py "${{ github.event.inputs.pdf_filename }}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule_data.json
          git commit -m "Manual data overwrite: ${{ github.event.inputs.pdf_filename }}" || echo "No changes to commit"
          git push origin main
