name: Update Schedule Data

on:
  push:
    paths:
      - 'schedule.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install pdfplumber
            
      - name: Run Converter
        run: python convert.py
        
      # This is the "Magic" step that swaps the placeholder for your real secret
      - name: Inject Admin Password
        run: |
          sed -i 's/SECRET_PLACEHOLDER/${{ secrets.ADMIN_PASSWORD }}/g' index.html

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule_data.json
          git commit -m "Auto-update schedule data" || exit 0
          git push
