name: Update Schedule Data

on:
  push:
    paths:
      - 'schedule.pdf'  # This triggers the action ONLY when this file changes
  workflow_dispatch:     # This allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
            pip install pdfplumber
            
      - name: Run Converter
        run: python convert.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add schedule_data.json
          git commit -m "Auto-update schedule data" || exit 0
          git push
