name: Update Schedule JSON

# Trigger this action whenever a PDF file is pushed to the repo
on:
  push:
    paths:
      - '*.pdf'
  workflow_dispatch: # Allows you to run this manually from Actions tab if needed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Gives the bot permission to save the JSON file

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pdfplumber

      - name: Run Converter Script
        run: |
          python convert.py

      - name: Commit and Push JSON
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add schedule_data.json
          # Only commit if the file actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule_data.json" && git push)
